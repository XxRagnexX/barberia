# nombre de la app y el puerto -> http://localhost:8080
spring.application.name=api_barberia
server.port=8080

# aqui se conecta a la base de datos H2, es en memoria asi que los datos
# se borran cada vez que apago la app (me paso unas cuantas veces)
spring.datasource.url=jdbc:h2:mem:barberia_db
spring.datasource.username=sa
spring.datasource.password=

# la consola para ver las tablas -> http://localhost:8080/h2-console
spring.h2.console.enabled=true

# esto hace que hibernate cree las tablas desde las clases del paquete model,
# no se exactamente como pero funciona
spring.jpa.hibernate.ddl-auto=create-drop
# esto muestra en la consola el sql que se esta ejecutando
spring.jpa.show-sql=true

# esto es para que cargue el data.sql despues de que cree las tablas,
# si no lo ponia no me cargaba los datos de ejemplo y me tarde en darme cuenta
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
